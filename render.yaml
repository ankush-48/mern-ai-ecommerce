services:
  - type: web
    name: novacart
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: cd server && node utils/bootstrap.js --catalog && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false

